name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Validation platform (all for release)
        default: all
        type: choice
        options: [all, windows]

jobs:
  # ============================================================
  # Job 1: 构建 macOS DMG (arm64 Apple Silicon)
  # ============================================================
  build-mac:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 给二进制文件添加执行权限
        run: |
          chmod +x bin/darwin/mihomo_aarch64
          chmod +x bin/darwin/mihomo_x86_64
          chmod +x bin/darwin/axel

      - name: 传输记录、恢复和操作系统暂停回归
        run: npm test

      - name: 专属内核 2 GiB、并发、暂停和主进程强杀恢复
        run: node scripts/check-native-app.js --stress

      - name: 使用声明、拒绝保护和重启记忆
        run: npm run test:usage

      - name: 实际桌面批量按钮与手动 MD5 校验
        run: npm run test:desktop

      - name: 完整下载真实 EBI 文件并独立校验 MD5
        run: node scripts/check-live-ebi-download.js

      - name: 保存真实下载验证结果
        uses: actions/upload-artifact@v4
        with:
          name: live-ebi-macos
          path: |
            .evidence/live-ebi-*.json
            .evidence/download-diagnostics-*.json
            .evidence/download-progress-*.json
            .evidence/progress-*.png
            .evidence/settings-*.png
            .evidence/native-*.json
            .evidence/usage-*
            .evidence/ssh-desktop-*
          include-hidden-files: true

      - name: 依据 Git Tag 同步 package.json 版本号
        run: node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); const tag = process.env.GITHUB_REF_NAME; if (tag && tag.startsWith('v')) { pkg.version = tag.replace(/^v/, ''); fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2)); console.log('Updated package.json version to:', pkg.version); }"

      - name: 写入构建期全局配置 (config.json)
        run: |
          url="${{ secrets.BACKEND_BASE_URL }}"
          if [ -z "$url" ]; then
            url="https://biodown.ye.aimeals.cn"
          fi
          echo "{\"BACKEND_BASE_URL\":\"$url\"}" > config.json
          echo "Injecting backend URL: $url"

      - name: 打包 macOS DMG
        run: npm run dist
        env:
          # 跳过代码签名（无开发者证书时）
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 验证成品热更新及二次启动
        run: node scripts/check-packaged-update.js dist/mac-arm64/BioDownloader.app

      - name: 上传 Mac 更新验收
        uses: actions/upload-artifact@v4
        with:
          name: update-macos
          path: .evidence/packaged-update-darwin.json
          include-hidden-files: true

      - name: 上传 Mac 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/*.dmg

  # ============================================================
  # Job 2: 构建 Windows EXE (x64)
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 npm 依赖
        run: npm ci

      - name: 验证安装包内置 aria2 独立运行
        run: node scripts/check-bundled-aria.js

      - name: 传输记录、恢复和操作系统暂停回归
        run: npm test

      - name: 专属内核 2 GiB、并发、暂停和主进程强杀恢复
        run: node scripts/check-native-app.js --stress

      - name: 使用声明、拒绝保护和重启记忆
        run: npm run test:usage

      - name: 实际桌面批量按钮与手动 MD5 校验
        run: npm run test:desktop

      - name: 完整下载真实 EBI 文件并独立校验 MD5
        run: node scripts/check-live-ebi-download.js

      - name: 保存真实下载验证结果
        uses: actions/upload-artifact@v4
        with:
          name: live-ebi-windows
          path: |
            .evidence/live-ebi-*.json
            .evidence/download-diagnostics-*.json
            .evidence/download-progress-*.json
            .evidence/progress-*.png
            .evidence/settings-*.png
            .evidence/native-*.json
            .evidence/usage-*
            .evidence/ssh-desktop-*
          include-hidden-files: true

      - name: 依据 Git Tag 同步 package.json 版本号
        run: node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); const tag = process.env.GITHUB_REF_NAME; if (tag && tag.startsWith('v')) { pkg.version = tag.replace(/^v/, ''); fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2)); console.log('Updated package.json version to:', pkg.version); }"

      - name: 写入构建期全局配置 (config.json)
        shell: pwsh
        run: |
          $url = "${{ secrets.BACKEND_BASE_URL }}"
          if ([string]::IsNullOrEmpty($url)) {
              $url = "https://biodown.ye.aimeals.cn"
          }
          $config = @{ BACKEND_BASE_URL = $url }
          $config | ConvertTo-Json | Set-Content -Path config.json -Encoding utf8
          Write-Host "Injecting backend URL: $url"

      - name: 打包 Windows EXE
        run: npm run dist -- --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 从 Windows 成品 app.asar 运行下载与插件测试
        run: npm run test:desktop
        env:
          BIODL_TEST_ASAR: dist/win-unpacked/resources/app.asar

      - name: 验证 Windows 成品使用声明
        run: npm run test:usage
        env:
          BIODL_TEST_ASAR: dist/win-unpacked/resources/app.asar

      - name: 验证成品热更新及二次启动
        run: node scripts/check-packaged-update.js dist/win-unpacked

      - name: 上传 Windows 更新验收
        uses: actions/upload-artifact@v4
        with:
          name: update-windows
          path: .evidence/packaged-update-win32.json
          include-hidden-files: true

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/BioDownloader-Setup-*.exe
            dist/BioDownloader-Setup-*.exe.blockmap

  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: 复用已验证的静态 Axel 以兼容旧断点
        run: |
          curl -fL --retry 3 -o /tmp/axel-baseline.tar.gz https://github.com/sandy9707/bio-downloader/releases/download/v2.0.49/BioDownloader-Linux-x64-2.0.49.tar.gz
          echo '1d95428cc59961853a8b940a7b13ff2d014645eda99215aef33a1a24808deef0  /tmp/axel-baseline.tar.gz' | sha256sum -c -
          tar xzf /tmp/axel-baseline.tar.gz -C /tmp BioDownloader-Linux-x64/bin/linux/axel
          cp /tmp/BioDownloader-Linux-x64/bin/linux/axel bin/linux/axel
          chmod +x bin/linux/axel
      - name: 构建支持 SFTP 的独立 aria2 引擎
        run: bash scripts/prepare-linux-aria.sh
      - name: Linux 核心、测速与 Web 桥接回归
        run: npm test
      - name: 专属内核 2 GiB、并发、暂停和主进程强杀恢复
        run: node scripts/check-native-app.js --stress
      - name: 完整 EBI 下载及独立 MD5
        run: node scripts/check-live-ebi-download.js
      - name: 保存 Linux 真实下载结果
        uses: actions/upload-artifact@v4
        with:
          name: live-ebi-linux
          path: |
            .evidence/live-ebi-*.json
            .evidence/download-diagnostics-*.json
            .evidence/download-progress-*.json
            .evidence/progress-*.png
            .evidence/settings-*.png
            .evidence/native-*.json
            .evidence/usage-*
            .evidence/ssh-desktop-*
          include-hidden-files: true
      - name: 保持旧服务器 glibc 2.17 运行时兼容
        run: |
          curl -fL --retry 3 -o /tmp/linux-baseline.tar.gz https://biodown.ye.aimeals.cn/downloads/BioDownloader-Linux-x64-2.0.41.tar.gz
          echo '4cad88e61148179a58701c017eedc8734e63ca878ddcdd8769c5dc99c63e4bd6  /tmp/linux-baseline.tar.gz' | sha256sum -c -
          mkdir /tmp/biodl-baseline
          tar xzf /tmp/linux-baseline.tar.gz -C /tmp/biodl-baseline
      - name: 打包 Linux
        run: npm run build:linux
        env:
          BIODL_NODE_RUNTIME: /tmp/biodl-baseline/BioDownloader-Linux-x64/runtime/node
      - name: 验证新包和 2.0.41 原地升级
        run: node scripts/check-linux-upgrade.js /tmp/biodl-baseline/BioDownloader-Linux-x64 "dist/BioDownloader-Linux-x64-$(node -p "require('./package.json').version").tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/BioDownloader-Linux-x64-*.tar.gz
            dist/BioDownloader-Linux-x64-*.tar.gz.sha256

  # ============================================================
  # Job 3: 发布到 GitHub Releases (仅推 tag 时执行)
  # ============================================================
  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: 下载 Mac 产物
        uses: actions/download-artifact@v4
        with:
          name: mac-dist
          path: ./release-files

      - name: 下载 Windows 安装包
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release-files

      - name: 下载 Linux 产物
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: ./release-files

      - name: 查看产物
        run: ls -lh ./release-files/

      - name: 生成 latest 别名资产(供官网 gh-proxy 镜像 releases/latest/download 永不过期)
        run: |
          cd ./release-files
          echo "== alias step: before =="
          ls -la
          dmg_name="$(ls -1 BioDownloader-*-arm64.dmg 2>/dev/null | head -n 1 || true)"
          exe_name="$(ls -1 *.exe 2>/dev/null | grep -v latest | head -n 1 || true)"
          if [ -n "$dmg_name" ]; then cp "$dmg_name" BioDownloader-latest-arm64.dmg; echo "alias: BioDownloader-latest-arm64.dmg <- $dmg_name"; fi
          if [ -n "$exe_name" ]; then cp "$exe_name" BioDownloader-latest.exe; echo "alias: BioDownloader-latest.exe <- $exe_name"; fi
          echo "== alias step: after =="
          ls -la

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "生信原始数据下载器 ${{ github.ref_name }}"
          body: |
            ## 下载说明

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | 🍎 macOS (Apple Silicon / arm64) | `BioDownloader-*-arm64.dmg` | 仅支持 Apple Silicon，暂未提供 Intel Mac 安装包；双击打开后拖动到应用程序文件夹 |
            | 🐧 Linux x64 | `BioDownloader-Linux-x64-*.tar.gz` | Server + Web UI + CLI，支持 glibc 2.17 及以上 |
            | 🪟 Windows 64位 | `BioDownloader-Setup-*.exe` | 按用户安装版，支持自选目录并创建桌面快捷方式 |

            ## 安装与运行步骤
            - **Windows**: 下载 `BioDownloader-Setup-*.exe` → 双击安装 → 从桌面快捷方式启动。
            - **macOS**: 下载 DMG → 双击打开 → 将 `BioDownloader.app` 拖入 Applications (应用程序) 文件夹。

            ---

            ## 🍎 Mac 提示"已损坏，打不开"解决办法
            由于本软件未向 Apple 购买官方昂贵的开发者证书，在 macOS 下首次打开会提示"已损坏，打不开"或"来自未识别的开发者"。
            这是苹果官方的安全阻拦，请使用以下简单命令解锁：

            1. 打开系统自带的 **终端 (Terminal)**
            2. 输入以下命令并回车（需要输入您的 Mac 开机密码）：
               ```bash
               sudo xattr -cr /Applications/BioDownloader.app
               ```

            ---

            ## 首次使用指引
            1. 启动软件，进入「我的」页面注册并登录您的账户。
            2. 在「下载中心」选择数据类型（SRA/EBI/GEO/直链），输入对应编号或链接，点击"检验下载大小"后即可享受 16 线程加速下载。
          files: ./release-files/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'preview') }}
