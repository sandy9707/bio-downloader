name: Prepare portable aria2
on: workflow_dispatch
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/prepare-linux-aria.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux-aria2
          path: dist/aria2-portable
