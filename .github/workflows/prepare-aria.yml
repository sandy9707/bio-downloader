name: Prepare portable aria2
on:
  workflow_dispatch:
  push:
    branches: [feat/aria2-2.1]
    paths: [scripts/prepare-linux-aria.sh, .github/workflows/prepare-aria.yml]
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/prepare-linux-aria.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux-aria2
          path: dist/aria2-portable
