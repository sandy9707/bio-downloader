name: Native Windows downloader validation
on: workflow_dispatch
jobs:
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/check-bundled-aria.js
      - run: npm test
      - run: npm run test:desktop
      - run: node scripts/check-live-ebi-download.js
