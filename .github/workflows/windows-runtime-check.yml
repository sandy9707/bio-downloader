name: Diagnose Windows aria2 runtime
on:
  push:
    branches: [fix/progress-2.1.2]
jobs:
  native-path-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/diagnose-windows-aria.js
