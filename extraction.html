<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>引导式提取 · User-Guided Extraction</title>
  <style>
    :root {
      --bg: #f0f4f8; --panel: #ffffff; --panel-2: #f8fafc; --border: rgba(203,213,225,0.85);
      --text: #0f172a; --muted: #64748b; --primary: #4f46e5; --primary-grad: linear-gradient(135deg,#6366f1,#4f46e5);
      --code-bg: #f1f5f9; --code-text: #334155; --danger: #ef4444; --webview-bg: #ffffff;
    }
    body.dark-mode {
      --bg: #0b0f19; --panel: rgba(30,41,59,0.7); --panel-2: #0f172a; --border: rgba(51,65,85,0.6);
      --text: #f8fafc; --muted: #94a3b8; --primary: #818cf8; --primary-grad: linear-gradient(135deg,#6366f1,#4f46e5);
      --code-bg: #0b0f19; --code-text: #cbd5e1; --webview-bg: #0b0f19;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden;
      font-variant-numeric: tabular-nums;
    }

    /* 顶部地址栏 */
    .ex-toolbar {
      display: flex; align-items: center; gap: 6px; padding: 9px 12px;
      background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto;
    }
    .ex-btn {
      width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel-2);
      color: var(--text); cursor: pointer; font-size: 15px; line-height: 1; flex: 0 0 auto;
      transition: background .15s, transform .1s;
    }
    .ex-btn:hover { background: rgba(99,102,241,0.12); }
    .ex-btn:active { transform: scale(.94); }
    .ex-url {
      flex: 1; min-width: 120px; height: 34px; padding: 0 12px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: 13px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .ex-url:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .ex-go {
      height: 34px; padding: 0 18px; border: none; border-radius: 9px; background: var(--primary-grad);
      color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; flex: 0 0 auto; transition: filter .15s, transform .1s;
    }
    .ex-go:hover { filter: brightness(1.06); }
    .ex-go:active { transform: scale(.97); }

    /* 主体:网页 + 右侧嗅探栏 */
    .ex-body { flex: 1; display: flex; gap: 10px; padding: 10px; min-height: 0; }
    .ex-main {
      flex: 1; min-width: 0; position: relative; border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; background: var(--webview-bg);
    }
    /* webview 始终挂载(保证 guest 进程初始化,避免 display:none 导致首次加载空白) */
    .ex-webview { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

    /* 起始页作为覆盖层(z-index 在上),导航时隐藏以露出下方已挂载的 webview */
    .ex-start {
      position: absolute; inset: 0; z-index: 2; padding: 30px 26px; overflow: auto;
      display: flex; flex-direction: column; gap: 16px; background: var(--webview-bg);
    }
    .ex-start-hint { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .ex-sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .ex-site {
      border: 1px solid var(--border); border-radius: 11px; background: var(--panel); padding: 12px 13px;
      cursor: pointer; transition: transform .12s, border-color .12s, box-shadow .12s;
    }
    .ex-site:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: 0 6px 16px rgba(79,70,229,0.12); }
    .ex-site-name { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 7px; }
    .ex-site-open { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--primary); }
    .ex-site-desc { color: var(--muted); font-size: 12px; margin-top: 5px; line-height: 1.55; }
    .ex-site-eg {
      display: none; margin-top: 9px; padding: 9px 10px; background: var(--code-bg); color: var(--code-text);
      border-radius: 8px; font-size: 11.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
    }
    .ex-site.open .ex-site-eg { display: block; }

    /* 右侧栏 */
    .ex-side { width: 300px; flex: 0 0 300px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .ex-side-head { font-size: 12.5px; font-weight: 800; padding: 1px 3px; }
    .ex-hint { font-weight: 400; color: var(--muted); font-size: 10.5px; }
    .ex-resources {
      flex: 1; min-height: 80px; overflow: auto; background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 6px;
    }
    .ex-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 22px 8px; line-height: 1.8; }
    .ex-res {
      padding: 7px 8px; border-radius: 8px; cursor: pointer; margin-bottom: 3px; border: 1px solid transparent;
      transition: background .12s, border-color .12s;
    }
    .ex-res:hover { background: var(--panel-2); border-color: var(--border); }
    .ex-res-name { font-size: 12px; display: block; line-height: 1.4; word-break: break-all; }
    .ex-res-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .ex-res.important { background: rgba(244,63,94,0.10); border-color: rgba(244,63,94,0.4); }
    .ex-res.important .ex-res-name { color: var(--danger); font-weight: 800; }
    .ex-codebox { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 7px; flex: 0 0 auto; }
    .ex-codebox textarea {
      width: 100%; resize: vertical; border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg);
      color: var(--code-text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; padding: 7px; line-height: 1.5; outline: none;
    }
    .ex-run {
      width: 100%; margin-top: 6px; height: 32px; border: none; border-radius: 8px; background: var(--primary-grad);
      color: #fff; font-weight: 700; font-size: 12.5px; cursor: pointer; transition: filter .15s, transform .1s;
    }
    .ex-run:hover { filter: brightness(1.06); }
    .ex-run:active { transform: scale(.98); }

    .ex-toast {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(12px);
      background: rgba(15,23,42,0.92); color: #fff; font-size: 12.5px; padding: 8px 14px; border-radius: 10px;
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 80%; z-index: 50;
    }
    .ex-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 820px) {
      .ex-body { flex-direction: column; }
      .ex-side { width: 100%; flex: 0 0 auto; }
      .ex-resources { max-height: 200px; }
    }
  </style>
</head>
<body>
  <div class="ex-toolbar">
    <button class="ex-btn" id="exBack" title="后退">←</button>
    <button class="ex-btn" id="exFwd" title="前进">→</button>
    <button class="ex-btn" id="exReload" title="刷新">⟳</button>
    <button class="ex-btn" id="exHome" title="返回起始页">🏠</button>
    <input type="text" id="exUrl" class="ex-url" placeholder="输入网址，例如 https://www.ncbi.nlm.nih.gov">
    <button class="ex-go" id="exGo">前往</button>
    <button class="ex-btn" id="exClear" title="清除内置浏览器会话（用于刷新 Token）">🧹</button>
  </div>

  <div class="ex-body">
    <div class="ex-main">
      <!-- 网页区:由主进程 BrowserView 渲染在 .ex-main 区域(BrowserView 覆盖其上) -->
      <div class="ex-start" id="exStart">
        <div class="ex-start-hint">在下方输入网址开始浏览，或点击下方常用站点（点开查看用法示例）。<br>登录 / 点击 Send to / Download 后，真实下载会被自动拦截并送入主窗口「传输列表」。<br><b>提示：访问境外站点（如 NCBI / Broad）请先在主窗口开启加速器。</b></div>
        <div class="ex-sites" id="exSites"></div>
      </div>
    </div>

    <aside class="ex-side">
      <div class="ex-side-head">🔎 资源嗅探</div>
      <div class="ex-resources" id="exResources">
        <div class="ex-empty">浏览网页后，这里会列出可下载资源。<br>重要资源会<b style="color:#ef4444">加粗红字</b>置顶，点击即可下载。</div>
      </div>
      <div class="ex-codebox">
        <div class="ex-side-head">⌨️ 代码框 <span class="ex-hint">粘贴 cURL / Broad 下载代码</span></div>
        <textarea id="exCode" rows="3" placeholder='curl "https://singlecell.broadinstitute.org/.../generate_curl_config?accessions=SCP259&auth_code=..." -o cfg.txt; curl -K cfg.txt'></textarea>
        <button class="ex-run" id="exRun">执行下载</button>
      </div>
    </aside>
  </div>

  <div class="ex-toast" id="exToast"></div>

  <script src="extraction.js"></script>
</body>
</html>
